name: Update
on:
  schedule:
    - cron: "30 22 * * 1-5"    # prices, every weekday after the US close
    - cron: "0 7 * * 1"        # full weekly run with the SEC scan, Monday 07:00 UTC
  workflow_dispatch: {}        # run by hand from the Actions tab
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: Run the monitor
        env:
          PYTHONUNBUFFERED: "1"
          MONITOR_MODE: ${{ github.event.schedule == '30 22 * * 1-5' && 'daily' || 'weekly' }}
        run: python -m monitor.run
      - name: Publish
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add docs config/history.json data/edgar_seen.json data/edgar_findings.json data/kpi_history.json data/alerts.json data/archive.json
          git diff --cached --quiet || git commit -m "Update $(date -u +%Y-%m-%d)"
          git push
      - name: Open an issue if there are alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python -c "import json; print(len(json.load(open('data/alerts.json'))['alerts']))")
          if [ "$n" -gt 0 ]; then
            body=$(python -c "import json; a=json.load(open('data/alerts.json')); print('\n'.join('- '+x for x in a['alerts']))")
            title="Monitor alerts $(date -u +%Y-%m-%d)"
            if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
              gh issue create --title "$title" --body "$body"
            fi
          fi
      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Monitor run failed $(date -u +%Y-%m-%d)" --body "See the run log at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
